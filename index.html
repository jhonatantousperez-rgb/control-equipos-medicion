<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Metrológico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral de navegación + área de trabajo; en móvil la navegación pasa a una franja superior con scroll horizontal */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface2:#F5F8F8; --ink:#0F2229; --ink2:#4A5F67; --line:#D7E0E3;
  --accent:#0A7C78; --accent-ink:#FFFFFF; --accent-soft:#DCF1EF;
  --ok:#1F7A4C; --ok-soft:#DDF1E5; --warn:#8F6100; --warn-soft:#FBEFCF;
  --crit:#B8321F; --crit-soft:#FBE1DC; --info:#2B62A8; --info-soft:#DEE9F7;
  --shadow:0 1px 2px rgba(15,34,41,.06),0 4px 16px rgba(15,34,41,.05);
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1317; --surface:#131D23; --surface2:#18252C; --ink:#E4EEF0; --ink2:#93A8AF; --line:#263640;
  --accent:#3CC2BB; --accent-ink:#06201F; --accent-soft:#123A3A;
  --ok:#54C58A; --ok-soft:#14301F; --warn:#E3B341; --warn-soft:#3A2E10;
  --crit:#F1796A; --crit-soft:#3D1A16; --info:#78AEEB; --info-soft:#15283F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1317; --surface:#131D23; --surface2:#18252C; --ink:#E4EEF0; --ink2:#93A8AF; --line:#263640;
  --accent:#3CC2BB; --accent-ink:#06201F; --accent-soft:#123A3A;
  --ok:#54C58A; --ok-soft:#14301F; --warn:#E3B341; --warn-soft:#3A2E10;
  --crit:#F1796A; --crit-soft:#3D1A16; --info:#78AEEB; --info-soft:#15283F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:1.5rem;letter-spacing:-.01em} h2{font-size:1.02rem} h3{font-size:.92rem}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
.muted{color:var(--ink2)} .small{font-size:.82rem} .right{text-align:right}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding-block:16px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:18px;padding:6px 0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.brand svg{flex:none;color:var(--accent)}
.brand b{display:block;font-size:1rem;letter-spacing:-.01em;line-height:1.15}
.brand span{font-size:.74rem;color:var(--ink2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a svg{flex:none;width:18px;height:18px}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--crit-soft);color:var(--crit)}
.side-foot{padding:0 8px;font-size:.78rem;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.top .sub{color:var(--ink2);font-size:.86rem;margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.banner .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:.8rem;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-eq{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--ink2)}
.kpi .l{font-size:.78rem;color:var(--ink2);font-weight:500}
.kpi .v{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi .s{font-size:.76rem;color:var(--ink2)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.toolbar .grow{flex:1 1 220px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar input,.toolbar select{width:auto}
.toolbar input.grow{width:100%}
textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:.82rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface2)} tr.click{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;font-size:.84rem;color:var(--ink2);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink2)}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)}
.alert b{font-weight:600} .alert .d{color:var(--ink2);font-size:.84rem}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.bars .b.hot i{background:var(--crit)} .bars .b.mid i{background:var(--warn)}
.bars .n{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--ink2)}
.bars .m{font-size:.7rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.rowline{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:6px 0;font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--ink2)}
.hint.warn{background:var(--warn-soft);color:var(--warn)} .hint.crit{background:var(--crit-soft);color:var(--crit)} .hint.ok{background:var(--ok-soft);color:var(--ok)}
.overlay{position:fixed;inset:0;background:rgba(8,16,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink2);font-weight:500;min-width:0}
.form .full{grid-column:1/-1}
.picklist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.pick:first-child{border-top:0} .pick:hover{background:var(--surface2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div span{display:block;font-size:.74rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kv div b{font-weight:600}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:340px;font-size:.88rem}
.empty{padding:36px 16px;text-align:center;color:var(--ink2)}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .t{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.timeline .t:first-child{border-top:0}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:0}
  .nav{flex-direction:row;overflow-x:auto;max-width:100%;padding-bottom:4px}
  .nav a{white-space:nowrap}
  .side-foot{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.side-foot #hoy{display:none}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .rowline{grid-template-columns:90px minmax(0,1fr) 46px}
}
@media (max-width:520px){.g-kpi{grid-template-columns:1fr 1fr}.kpi .v{font-size:1.5rem}}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .12s ease-out}@keyframes fade{from{opacity:0}}}
input[type=checkbox]{width:auto}
</style>

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS_KEY = 'ctrlmet.v1';
const TIPOS = ['Termohigrómetro', 'Termómetro digital', 'Termómetro de punzón'];
const ESTADOS = ['En uso', 'Disponible', 'No disponible', 'En tránsito', 'En laboratorio', 'Baja'];
const ENVIABLES = ['En uso', 'Disponible', 'No disponible'];
const CAPITALES = { 'CAUCA': 'POPAYAN', 'VALLE DEL CAUCA': 'CALI', 'TOLIMA': 'IBAGUE', 'RISARALDA': 'PEREIRA', 'NARIÑO': 'PASTO', 'CUNDINAMARCA': 'BOGOTA', 'CAQUETA': 'FLORENCIA', 'GUAJIRA': 'RIOHACHA', 'BOYACA': 'TUNJA', 'QUINDIO': 'ARMENIA', 'CALDAS': 'MANIZALES', 'ANTIOQUIA': 'MEDELLIN', 'VAUPES': 'MITU' };
const nrm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const esCapital = (dep, mun) => nrm(CAPITALES[String(dep).toUpperCase().trim()] || '') === nrm(mun) || /cendis|cedis/.test(nrm(mun));
const DEF_CFG = { a1: 60, a2: 30, a3: 15, diasLab: 15, maxTransito: 5, maxLab: 20, meses: 12 };

function today0() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = s ? pd(s) : today0(); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n) { const d = pd(s); const day = d.getDate(); d.setMonth(d.getMonth() + n); if (d.getDate() !== day) d.setDate(0); return iso(d); }
function daysTo(s) { return s ? Math.round((pd(s) - today0()) / 86400000) : null; }
function daysSince(s) { return s ? -daysTo(s) : null; }
function fmt(s) { return s ? pd(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '') : '—'; }
const todayIso = () => iso(today0());

let S = null; // estado
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function baseData() { const d = JSON.parse(JSON.stringify(BASE)); return { puntos: d.puntos, equipos: d.equipos, movs: [], cfg: { ...DEF_CFG }, seq: 1, demo: false }; }

/* ---- Cálculos ---- */
const eqById = id => S.equipos.find(e => e.id === id);

const REQ = [['Termohigrómetro', 'reqTH'], ['Termómetro digital', 'reqT'], ['Termómetro de punzón', 'reqP']];

function vigencia(e) { // estado metrológico
  if (e.estado === 'Baja') return { k: 'baja', t: 'Baja', c: '' };
  const d = daysTo(e.venc), c = S.cfg;
  if (d === null) return { k: 'sin', t: 'Sin fecha', c: 'warn', d };
  if (d < 0) return { k: 'vencido', t: 'Vencido hace ' + (-d) + ' d', c: 'crit', d };
  if (d <= c.a3) return { k: 'critico', t: 'Vence en ' + d + ' d', c: 'crit', d };
  if (d <= c.a2) return { k: 'proximo', t: 'Vence en ' + d + ' d', c: 'warn', d };
  if (d <= c.a1) return { k: 'aviso', t: 'Vence en ' + d + ' d', c: 'info', d };

}
const valido = e => e.estado === 'En uso' && daysTo(e.venc) !== null && daysTo(e.venc) >= 0;

function cobertura(p) {
  const asign = S.equipos.filter(e => e.puntoId === p.id && e.estado !== 'Baja');
  const faltas = [], riesgos = [];
  REQ.map(([t, k]) => [t, p[k] || 0]).forEach(([tipo, req]) => {
    if (!req) return;
    const deTipo = asign.filter(e => e.tipo === tipo), ok = deTipo.filter(valido);
    if (ok.length < req) {
      const falta = req - ok.length, malo = deTipo.filter(e => !valido(e));
      let causa = 'Sin equipo asignado';
      if (malo.some(e => e.estado === 'En tránsito' || e.estado === 'En laboratorio')) causa = 'En calibración';
      else if (malo.length) causa = 'Calibración vencida';
      faltas.push({ tipo, falta, causa });
    } else if (ok.slice(0, req).some(e => daysTo(e.venc) <= S.cfg.a2)) riesgos.push({ tipo });
  });
  const estado = p.sinOperar ? 'inactivo' : faltas.length ? 'descubierto' : riesgos.length ? 'riesgo' : 'cubierto';
  const prox = asign.filter(e => e.estado === 'En uso').map(e => e.venc).sort()[0] || null;
  return { estado, faltas, riesgos, asign, prox };
}

function reemplazoPara(e, excluir) {

}

function genAlertas() {
  const A = [], c = S.cfg, sev = { crit: 0, warn: 1, info: 2 };
  S.equipos.forEach(e => {
    if (e.estado === 'Baja') return;
    const v = vigencia(e), pn = e.puntoId ? ptName(e.puntoId) : 'Bodega';
    if (ENVIABLES.includes(e.estado)) {
      if (v.k === 'sin') A.push({ sev: 'warn', tipo: 'Datos', t: e.codigo + ' sin fecha de calibración', d: pn + ' · registre la fecha del certificado', ref: ['eq', e.id], n: 50 });
      if (v.k === 'vencido') A.push({ sev: 'crit', tipo: 'Vencido', t: e.codigo + ' con calibración vencida', d: pn + ' · venció el ' + fmt(e.venc), ref: ['eq', e.id], n: v.d });
      else if (v.k === 'critico') A.push({ sev: 'crit', tipo: 'Por vencer', t: e.codigo + ' vence en ' + v.d + ' días', d: pn + ' · ' + fmt(e.venc), ref: ['eq', e.id], n: v.d });
      else if (v.k === 'proximo') A.push({ sev: 'warn', tipo: 'Por vencer', t: e.codigo + ' vence en ' + v.d + ' días', d: pn + ' · ' + fmt(e.venc), ref: ['eq', e.id], n: v.d });
      else if (v.k === 'aviso') A.push({ sev: 'info', tipo: 'Planificar', t: e.codigo + ' vence en ' + v.d + ' días', d: pn + ' · ' + fmt(e.venc), ref: ['eq', e.id], n: v.d });
    }
    if (e.estado === 'En tránsito' && e.envio) { const t = daysSince(e.envio.fecha); if (t > c.maxTransito) A.push({ sev: 'warn', tipo: 'Envío demorado', t: e.codigo + ' lleva ' + t + ' días en tránsito', d: 'Guía ' + e.envio.guia + ' · ' + e.envio.transportadora, ref: ['eq', e.id], n: -t }); }
    if (e.estado === 'En laboratorio' && e.envio) { const t = daysSince(e.envio.fecha); if (t > c.maxLab) A.push({ sev: 'warn', tipo: 'Calibración demorada', t: e.codigo + ' lleva ' + t + ' días fuera', d: e.envio.laboratorio + ' · se esperaba en ' + c.maxLab + ' días', ref: ['eq', e.id], n: -t }); }
    if (e.estado === 'En uso' && !e.puntoId) A.push({ sev: 'warn', tipo: 'Datos', t: e.codigo + ' está en uso sin sitio asignado', d: 'Asigne un punto o devuélvalo a bodega', ref: ['eq', e.id], n: 0 });
    if (e.dupEn && e.dupEn.length) A.push({ sev: 'warn', tipo: 'Código duplicado', t: e.codigo + ' figura también en otro punto', d: 'Aparece en ' + e.dupEn.join(', ') + '. Verifique a cuál pertenece.', ref: ['eq', e.id], n: 60 });
    if (e.atip) A.push({ sev: 'info', tipo: 'Datos', t: 'Código atípico: ' + e.codigo, d: pn + ' · confirme que es el código del equipo y no un certificado', ref: ['eq', e.id], n: 98 });
    if (e.resultado === 'No conforme') A.push({ sev: 'crit', tipo: 'No conforme', t: e.codigo + ' resultó no conforme', d: 'Evaluar el impacto en producto almacenado desde la calibración anterior', ref: ['eq', e.id], n: -1 });
  });
  coberturaTodos().forEach(({ p, c: cv }) => {
    if (cv.estado === 'descubierto') { const f = cv.faltas.map(x => x.tipo.toLowerCase() + ' (' + x.causa.toLowerCase() + ')').join(', '); A.push({ sev: 'crit', tipo: 'Punto descubierto', t: p.nombre + ' sin cobertura', d: p.departamento + ' · ' + f, ref: ['pt', p.id], n: -2 }); }
  });

}

/* ---- caché local (solo puntos, equipos, config y marcas de sincronización) ---- */

/* ---- diferencias: solo se envía lo que cambió desde la última sincronización ---- */
function diff() {
  const up = { puntos: [], equipos: [] }, del = { puntos: [], equipos: [] }, hashes = {}, vivos = new Set(); let cfg = null;
  [['puntos', 'p', S.puntos], ['equipos', 'e', S.equipos]].forEach(([t, k, arr]) => arr.forEach(o => { const key = k + ':' + o.id; vivos.add(key); const h = h53(JSON.stringify(o)); if (CL.snap[key] !== h) { up[t].push(o); hashes[key] = h; } }));
  Object.keys(CL.snap).forEach(key => { if (key[0] !== 'c' && !vivos.has(key)) { const t = key[0] === 'p' ? 'puntos' : 'equipos'; del[t].push(key.slice(2)); } });
  const hc = h53(JSON.stringify(S.cfg)); if (CL.snap['c:main'] !== hc) { cfg = S.cfg; hashes['c:main'] = hc; }
  return { up, del, cfg, hashes, n: up.puntos.length + up.equipos.length + del.puntos.length + del.equipos.length + (cfg ? 1 : 0) };
}
function programar() { clearTimeout(CL.timer); CL.timer = setTimeout(cloudPush, 2000); }
const lotes = (a, n = LOTE) => { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };

async function cloudPush() {

  CL.pushing = true; setEstado('guardando');

    for (const t of ['puntos', 'equipos']) {
      for (const l of lotes(d.up[t])) { CL.reqs++; const { error } = await CL.sb.from(t).upsert(l.map(o => ({ id: o.id, data: o, deleted: false })), { onConflict: 'id' }); if (error) throw error; }
      for (const l of lotes(d.del[t])) { CL.reqs++; const { error } = await CL.sb.from(t).update({ deleted: true }).in('id', l); if (error) throw error; }
    }
    if (d.cfg) { CL.reqs++; const { error } = await CL.sb.from('config').upsert({ id: 'main', data: d.cfg }, { onConflict: 'id' }); if (error) throw error; }
    for (const l of lotes(pend)) { CL.reqs++; const { error } = await CL.sb.from('movimientos').upsert(l.map(m => ({ id: m.id, fecha: m.fecha, equipo_id: m.equipoId, tipo: m.tipo, origen: m.origen || null, destino: m.destino || null, guia: m.guia || null, nota: m.nota || null })), { onConflict: 'id', ignoreDuplicates: true }); if (error) throw error; l.forEach(m => { delete m.pend; }); }
    Object.assign(CL.snap, d.hashes); d.del.puntos.forEach(i => delete CL.snap['p:' + i]); d.del.equipos.forEach(i => delete CL.snap['e:' + i]);
    CL.ultimo = Date.now(); CL.backoff = 0; guardarCache(); setEstado('ok');

  finally { CL.pushing = false; if (CL.again) { CL.again = false; programar(); } }
}

/* ---- aplicar filas recibidas ---- */
function aplicarFila(t, r) {
  const k = t[0], key = k + ':' + r.id, arr = t === 'puntos' ? S.puntos : S.equipos, i = arr.findIndex(o => o.id === r.id);
  if (CL.ua[key] && r.updated_at <= CL.ua[key]) return false;
  if (i >= 0 && CL.snap[key] !== undefined && h53(JSON.stringify(arr[i])) !== CL.snap[key]) return false; // hay un cambio local pendiente: se conserva
  CL.ua[key] = r.updated_at;
  if (r.deleted) { if (i >= 0) arr.splice(i, 1); delete CL.snap[key]; return true; }
  const o = r.data; if (i >= 0) arr[i] = o; else arr.push(o); CL.snap[key] = h53(JSON.stringify(o)); return true;
}
async function cloudPull(completo) {
  if (!CL.on || !CL.user) return; if (completo) { CL.wm = {}; CL.ua = {}; }
  setEstado('cargando'); let cambios = 0;
  try {
    for (const t of ['puntos', 'equipos']) {
      const desde = CL.wm[t] ? new Date(Date.parse(CL.wm[t]) - 120000).toISOString() : null; let off = 0;
      for (;;) {
        let q = CL.sb.from(t).select('id,data,deleted,updated_at').order('updated_at', { ascending: true }).range(off, off + 999); if (desde) q = q.gt('updated_at', desde);
        CL.reqs++; const { data, error } = await q; if (error) throw error;
        data.forEach(r => { if (aplicarFila(t, r)) cambios++; if (!CL.wm[t] || r.updated_at > CL.wm[t]) CL.wm[t] = r.updated_at; });
        if (data.length < 1000) break; off += 1000;
      }
    }
    let qc = CL.sb.from('config').select('data,updated_at').eq('id', 'main'); if (CL.wm.config) qc = qc.gt('updated_at', CL.wm.config);
    CL.reqs++; const { data: cd, error: ce } = await qc.maybeSingle(); if (ce) throw ce;
    if (cd && cd.data) { S.cfg = { ...DEF_CFG, ...cd.data }; CL.snap['c:main'] = h53(JSON.stringify(S.cfg)); CL.wm.config = cd.updated_at; cambios++; }
    CL.ultimo = Date.now(); guardarCache(); setEstado('ok'); if (cambios) refrescarSuave();
  } catch (e) { setEstado('error', e.message || String(e)); }
}

/* ---- tiempo real: los cambios de otras personas llegan solos, sin consultar ---- */
function cloudRealtime() {

  ['puntos', 'equipos'].forEach(t => CL.ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => {

    if (r.updated_by === CL.user.id && CL.snap[t[0] + ':' + r.id] !== undefined) { CL.ua[t[0] + ':' + r.id] = r.updated_at; return; }
    if (aplicarFila(t, r)) { if (!CL.wm[t] || r.updated_at > CL.wm[t]) CL.wm[t] = r.updated_at; CL.ultimo = Date.now(); guardarCache(); refrescarSuave(); renderCuenta(); }
  }));

}

  const act = S.equipos.filter(e => e.estado !== 'Baja'), cov = coberturaTodos(), c = S.cfg, nAct = cov.filter(x => x.c.estado !== 'inactivo').length;
  const desc = cov.filter(x => x.c.estado === 'descubierto').length, ries = cov.filter(x => x.c.estado === 'riesgo').length;

  </div>

    <section class="card"><div class="card-h"><h2>Requiere acción</h2><button class="btn sm" data-act="goto" data-v="alertas" type="button">Ver las ${al.length} alertas</button></div>
